spring:
  config:
    import: optional:file:${ACTION_GUARD_LOCAL_CONFIG:./.local/action-guard.env}[.properties]
  datasource:
    username: ${MYSQL_USERNAME:action_guard}
    password: ${MYSQL_PASSWORD:}
    url: ${MYSQL_URL:jdbc:mysql://154.36.178.66:3306/action-guard?sslMode=REQUIRED&characterEncoding=UTF-8&connectionTimeZone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: action-guard-mysql
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
