spring:
  config:
    import: optional:file:${ACTION_GUARD_LOCAL_CONFIG:./.local/action-guard.env}[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: never
      continue-on-error: false
      schema-locations: classpath:db/action-guard-mysql-schema.sql
  rabbitmq:
    host: ${DEMO_RABBITMQ_HOST}
    port: ${DEMO_RABBITMQ_PORT:5672}
    username: ${DEMO_RABBITMQ_USERNAME}
    password: ${DEMO_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:}}
    virtual-host: ${DEMO_RABBITMQ_VIRTUAL_HOST}

action:
  guard:
    store:
      type: mysql
    execution:
      transport: rabbitmq
    definition-locations:
      - classpath*:actions/*.yml
      - classpath*:actions/*.yaml
    publish-retry-max-attempts: 1
    metrics-enabled: true
    recovery:
      enabled: true
      batch-size: 100
      fixed-delay: 5s
      claim-timeout: 30s
      compensation-timeout: 1m
      stuck-action-timeout: 5m
    rabbitmq:
      exchange: action.guard.execute
      routing-key-prefix: action.execute
      queue: action.guard.execute.queue
      consumer-group: action-guard-app

# 当前服务器已初始化表结构；新数据库应先执行初始化 SQL。
#
# 如果你接入了 webhook 告警模块，可按需打开：
# action:
#   guard:
#     alert:
#       webhook:
#         enabled: true
#         url: https://your-webhook.example.com/action-guard
