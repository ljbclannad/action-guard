spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${DEMO_H2_PATH:${user.home}/.action-guard/demo-db/action_guard_demo};MODE=MySQL;AUTO_SERVER=TRUE
    username: ${DEMO_H2_USERNAME:sa}
    password: ${DEMO_H2_PASSWORD:}
    hikari:
      pool-name: action-guard-demo-hikari
      minimum-idle: ${DEMO_DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DEMO_DB_POOL_MAX_SIZE:10}
      idle-timeout: ${DEMO_DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DEMO_DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DEMO_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DEMO_DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      auto-commit: true
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/action-guard-mysql-schema.sql
  rabbitmq:
    host: ${DEMO_RABBITMQ_HOST:localhost}
    port: ${DEMO_RABBITMQ_PORT:5672}
    username: ${DEMO_RABBITMQ_USERNAME:guest}
    password: ${DEMO_RABBITMQ_PASSWORD:guest}

action:
  guard:
    definition-locations:
      - classpath*:actions/*.yml
    rabbitmq:
      exchange: action.guard.execute
      routing-key-prefix: action.execute
      queue: action.guard.execute.queue
      consumer-group: action-guard-demo

demo:
  runner:
    enabled: ${DEMO_RUNNER_ENABLED:true}
