name: Feature Request
description: 提议一个能力增强、接入改进或治理改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请优先说明“要解决的问题”而不是直接给出实现方案。对于 `action-guard`，我们更关注是否符合最小接入、稳定扩展点和主链路边界。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个能力缺口具体影响什么使用场景
      placeholder: 例如：当前只有 webhook 告警，希望增加更通用的 metrics 对接示例
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 说明你希望框架提供什么能力，不要求先给出最终实现细节
      placeholder: 例如：新增一个 Micrometer 对接模块，或在 docs 中补一份官方接入示例
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 所属方向
      options:
        - Publish / Outbox
        - RabbitMQ / 消息执行
        - 治理 API
        - Notify / IM / Webhook 能力模块
        - 文档 / 示例
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: compatibility
    attributes:
      label: 兼容性影响
      options:
        - label: 这个提议可能影响公开 API / SPI
        - label: 这个提议可能影响 YAML 定义或默认配置
        - label: 这个提议可能影响当前最小 demo 路径

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 当前绕过方式
      description: 如果你当前有临时方案，也可以写出来
      placeholder: 例如：目前只能在业务项目里自行包装 ActionMetricsRecorder

