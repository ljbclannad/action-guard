name: Bug Report
description: 报告一个实际缺陷、回归或与文档不一致的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题。请尽量提供可复现信息，帮助我们快速判断这是否属于主链路缺陷、接入问题，还是预期外行为。

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 清楚说明发生了什么，以及为什么这不是预期行为
      placeholder: 例如：RabbitMQ 消费成功后，action_instance 仍停留在 DISPATCHING
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 尽量提供最小复现路径
      placeholder: |
        1. 使用哪些模块与配置
        2. 发布什么 action
        3. 观察到什么结果
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 例如：最终 action_instance.status 应进入 SUCCESS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息
      description: 粘贴关键日志、异常栈或数据库状态信息
      render: text

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 主链路（publish / outbox / rabbitmq / runtime）
        - 治理接口（ops-api）
        - 能力模块（notify / im / webhook）
        - 文档 / 示例
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交信息
      description: 例如 release 版本号、分支名或 commit id
      placeholder: 例如：0.1.0-SNAPSHOT / main / abc123

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 例如 JDK、Spring Boot、MySQL/H2、RabbitMQ 版本
      placeholder: |
        JDK:
        Spring Boot:
        DB:
        MQ:

